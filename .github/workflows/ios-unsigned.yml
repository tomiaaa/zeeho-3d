name: Build unsigned jailbreak IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Prepare app icons
        run: |
          ICON_DIR="native-ios/ZeehoPanel/Assets.xcassets/AppIcon.appiconset"
          sips -z 120 120 "$ICON_DIR/AppIcon-512.png" --out "$ICON_DIR/AppIcon-120.png"
          sips -z 1024 1024 "$ICON_DIR/AppIcon-512.png" --out "$ICON_DIR/AppIcon-1024.png"

      - name: Build unsigned app
        run: |
          xcodebuild archive \
            -project native-ios/ZeehoPanel.xcodeproj \
            -scheme ZeehoPanel \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/ZeehoPanel.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/ZeehoPanel.xcarchive/Products/Applications/ZeehoPanel.app" "$RUNNER_TEMP/ipa/Payload/"
          codesign --force --deep --sign - "$RUNNER_TEMP/ipa/Payload/ZeehoPanel.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/ipa/Payload/ZeehoPanel.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/ZeehoPanel-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v5
        with:
          name: ZeehoPanel-unsigned-ipa
          path: ${{ runner.temp }}/ZeehoPanel-unsigned.ipa
          if-no-files-found: error
